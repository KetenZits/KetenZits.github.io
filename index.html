<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <title>Toggle Box (iOS Optimized)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Kanit", serif;
        overflow-x: hidden;
      }

      body {
        background-color: rgb(255, 236, 236);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }

      .box {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        width: 90%;
        max-width: 400px;
      }

      .box h1 {
        animation: pls 1s infinite;
        cursor: pointer;
        border: 2px solid rgb(255, 46, 81);
        background-color: rgb(255, 142, 159);
        color: rgb(255, 212, 219);
        padding: 15px 25px;
        border-radius: 12px;
        transition: background-color 0.25s;
        text-align: center;
        margin: 20px 0;
      }

      .box h1:hover {
        background-color: rgb(253, 119, 139);
      }

      .box-text {
        border: 1px solid red;
        background-color: rgb(255, 142, 159);
        color: rgb(255, 212, 219);
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        font-size: 20px;
        max-width: 350px;
        width: 100%;
        visibility: hidden;
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .box-text.show {
        visibility: visible;
        opacity: 1;
        transform: scale(1);
      }

      .box-text img {
        max-width: 80%;
        height: auto;
        margin-top: 15px;
      }

      @keyframes pls {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (max-width: 430px) {
        .box h1 {
          font-size: 18px;
          padding: 12px 20px;
        }

        .box-text {
          font-size: 18px;
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1 onclick="toggleBox()">
        หายงอนนะ pls 🤧 <br />
        click me!
      </h1>
      <div class="box-text" id="boxText">
        Im sry ที่ทำให้งอน ทีหลังจะคิดก่อนทำ pls หายงอนกันนะ สัญญาชั้นจะไม่ทำอีก
        😺
        <img src="/cat.webp" alt="cute cat" />
        pls muhaha
      </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      function toggleBox() {
        var box = document.getElementById("boxText");
        box.classList.toggle("show"); // ใช้ class แทน display เพื่อให้ animation ทำงาน
      }
    </script>
  </body>
</html>
